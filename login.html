<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | KRISHI SATHI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="templates/css/style.css">
    <style>
      /* Optional: additional styling */
      body {
        background-image: url('templates/img/bg-farm.jpg'); /* optional background */
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      .card {
        background-color: rgba(255, 255, 255, 0.95);
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
      <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
        <h2 class="mb-4 text-center">Login to Krishi Sathi</h2>

        <!-- Alert (optional, hidden by default) -->
        <div id="loginAlert" class="alert alert-danger d-none" role="alert">
          Invalid email or password. Please try again.
        </div>

        <!-- Success Alert -->
        <div id="successAlert" class="alert alert-success d-none" role="alert">
          Login successful! Redirecting...
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Email</label>
            <input type="email" class="form-control" id="username" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Login</button>
        </form>

        <div class="alert alert-info mt-4" role="alert">
          Demo login: <strong>demo@demo.com</strong> / <strong>demo123</strong>
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2" id="demoLoginBtn">Fill demo</button>
        </div>

        <div class="mt-3 text-center">
          <span>Don't have an account?</span>
          <a href="register.html" class="text-primary">Register</a>
        </div>
      </div>
    </div>

    <script>
      // Set backend API base URL
      const API_BASE_URL = (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:10000/api' : '/api';

      // use backend authentication
      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorAlert = document.getElementById('loginAlert');
        const successAlert = document.getElementById('successAlert');

        errorAlert.classList.add('d-none');
        successAlert.classList.add('d-none');

        try {
          const res = await fetch(`${API_BASE_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Login failed');

          // success -- save token and user data to localStorage
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          // Fetch complete profile from database
          try {
            const profileRes = await fetch(`${API_BASE_URL}/farm/profile`, {
              method: 'GET',
              headers: {
                'Authorization': `Bearer ${data.token}`,
                'Content-Type': 'application/json'
              }
            });

            if (profileRes.ok) {
              const profileData = await profileRes.json();
              if (profileData.profile) {
                console.log('Profile fetched from database:', profileData.profile);
                localStorage.setItem('farmerProfile', JSON.stringify(profileData.profile));
              }
            } else {
              console.log('Could not fetch profile from database, will use basic data');
              // Create basic profile from registration data
              const basicProfile = {
                farmerId: data.user.id,
                fullName: data.user.name,
                email: data.user.email,
                photoUrl: data.user.photoUrl
              };
              localStorage.setItem('farmerProfile', JSON.stringify(basicProfile));
            }
          } catch (profileErr) {
            console.log('Error fetching full profile:', profileErr.message);
            // Still proceed with login even if profile fetch fails
            const basicProfile = {
              farmerId: data.user.id,
              fullName: data.user.name,
              email: data.user.email,
              photoUrl: data.user.photoUrl
            };
            localStorage.setItem('farmerProfile', JSON.stringify(basicProfile));
          }

          successAlert.classList.remove('d-none');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1500);
        } catch (err) {
          errorAlert.textContent = err.message;
          errorAlert.classList.remove('d-none');
        }
      });

      document.getElementById('demoLoginBtn').addEventListener('click', () => {
        document.getElementById('username').value = 'demo@demo.com';
        document.getElementById('password').value = 'demo123';
      });
    </script>
  </body>
</html>
