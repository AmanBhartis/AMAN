<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Successful | Krishi Sathi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="templates/css/style.css">
    <style>
      .success-card { max-width: 700px; margin: auto; }
      .order-row { display: flex; justify-content: space-between; }
      .summary-box { background: rgba(76, 175, 80, 0.1); border-radius: 12px; padding: 18px; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">KRISHI SATHI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav ms-auto gap-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="subsidy.html">Subsidy Store</a></li>
            <li class="nav-item"><a class="nav-link" href="market.html">Market</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="card p-4 success-card text-center">
        <div class="mb-4">
          <h1>Payment Complete!</h1>
          <p class="lead">Thank you for your order. Your subsidy purchase has been received successfully.</p>
        </div>

        <div class="summary-box mb-4">
          <h5>Order Summary</h5>
          <div id="summaryDetails"></div>
        </div>

        <div class="d-grid gap-3">
          <a class="btn btn-success" href="subsidy.html">Continue Shopping</a>
          <a class="btn btn-outline-secondary" href="index.html">Back to Home</a>
        </div>
      </div>
    </main>

    <script>
      const result = JSON.parse(localStorage.getItem('krishiSubsidyPaymentResult') || 'null');
      const summaryDetails = document.getElementById('summaryDetails');
      if (!result) {
        summaryDetails.innerHTML = '<p class="text-muted">No payment details found. If you just completed checkout, please go back to the store and try again.</p>';
      } else {
        const orderInfo = `
          <p><strong>Payment Method:</strong> ${result.paymentMethod === 'upi' ? 'UPI' : 'Cash on Delivery'}</p>
          <p><strong>Name:</strong> ${result.customerName}</p>
          <p><strong>Phone:</strong> ${result.customerPhone}</p>
          <p><strong>Address:</strong> ${result.customerAddress}, ${result.customerCity}, ${result.customerState} - ${result.customerPin}</p>
          <hr>
          ${result.items.map(item => `<div class="order-row"><span>${item.name} × ${item.quantity}</span><span>₹${item.subtotal}</span></div>`).join('')}
          <hr>
          <div class="order-row"><strong>Total Paid</strong><strong>₹${result.total}</strong></div>
        `;
        summaryDetails.innerHTML = orderInfo;
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
