<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | KRISHI SATHI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="templates/css/style.css">
  </head>
  <body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
      <div class="card shadow p-4" style="max-width: 450px; width: 100%;">
        <h2 class="mb-4 text-center">Register for Krishi Sathi</h2>

        <!-- Alert Messages -->
        <div id="register-msg" class="alert d-none" role="alert"></div>

        <form id="register-form">
          <!-- required user information for the Farmer schema -->
          <div class="mb-3">
            <label for="fullname" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullname" placeholder="Enter your full name" required>
          </div>
          <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="number" class="form-control" id="age" placeholder="Enter your age" min="1" required>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required>
          </div>
          <div class="mb-3">
            <label for="aadhaar" class="form-label">Aadhaar</label>
            <input type="text" class="form-control" id="aadhaar" placeholder="Enter your Aadhaar" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label for="photo" class="form-label">Photo (optional)</label>
            <input type="file" class="form-control" id="photo" accept="image/*">
          </div>
          <div class="mb-3 position-relative">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Create a password (min 6 chars)" required>
            <button type="button" class="btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2" tabindex="-1" style="z-index:2;" onclick="togglePassword('password', this)">
              <span class="eye-icon">👁️</span>
            </button>
          </div>
          <div class="mb-3 position-relative">
            <label for="confirm-password" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirm-password" placeholder="Re-enter your password" required>
            <button type="button" class="btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2" tabindex="-1" style="z-index:2;" onclick="togglePassword('confirm-password', this)">
              <span class="eye-icon">👁️</span>
            </button>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="register-btn">Register</button>
        </form>
        <div class="mt-3 text-center">
          <span>Already have an account?</span>
          <a href="login.html" class="text-success">Login</a>
        </div>
      </div>
    </div>

    <!-- scripts -->
    <script src="js/register.js"></script>
  </body>
</html>
